<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>비밀번호 변경</title>
<link rel="stylesheet" href="../we.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>body{margin:0}</style>
</head>
<body>
<div class="we" style="width: 100%; min-height: 900px">
  <header class="topbar">
    <span class="brand">White Eyes<small>관리자</small></span>
    <div class="head-right"><a class="btn secondary sm" href="SCR-C-001-login.html">로그아웃</a></div>
  </header>
  <main style="padding: 64px 24px; display: flex; justify-content: center">
    <form class="panel" data-api="PATCH /api/v1/me/password" data-fnc="FNC-C-007" style="width: 100%; max-width: 480px; overflow: hidden">
      <div class="panel-head"><div><p class="eyebrow">MY ACCOUNT</p><h2 style="margin-top: 4px">비밀번호 변경</h2></div></div>
      <div style="padding: 22px; display: flex; flex-direction: column; gap: 16px">
        <p style="padding: 12px 14px; border: 1px solid #6b5520; border-radius: 8px; background: #241d0f; color: #ffd27a; font-size: 12px">임시 비밀번호로 로그인했습니다. 새 비밀번호를 설정하세요.</p>
        <label class="field">현재 비밀번호<span class="input">••••••••••</span></label>
        <label class="field">새 비밀번호<span class="input ok">••••••••••••</span><span class="hint ok">8~64자, 영문·숫자를 각각 1자 이상(특수문자 가능)</span></label>
        <label class="field">새 비밀번호 확인<span class="input err">•••••••••••</span><span class="hint err">일치하지 않습니다</span></label>
        <button class="btn primary lg" type="button" style="width: 100%">변경</button>
      </div>
    </form>
  </main>
</div>
</body>
</html>
