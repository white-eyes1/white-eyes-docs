<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>로그인</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./we.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="we" style="width: 100%; min-height: 900px; display: flex; flex-wrap: wrap">
  <section style="flex: 1 1 520px; min-height: 900px; padding: 64px; display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid #253242; background: #0c121a">
    <p class="brand" style="font-size: 18px">White Eyes</p>
    <div style="display: flex; flex-direction: column; gap: 16px; max-width: 460px">
      <p class="eyebrow">DRONE CROWD MONITORING</p>
      <h1 style="font-size: 34px; font-weight: 700; line-height: 1.3">드론 영상으로 보는<br>구역별 혼잡 현황</h1>
      <p class="muted" style="font-size: 14px">구역마다 1분 단위 인원·밀집도를 모아 정상·주의·위험 단계로 보여 줍니다.</p>
      <div class="legend" style="margin-top: 8px"><span><i class="dot l1"></i>정상</span><span><i class="dot l2"></i>주의</span><span><i class="dot l3"></i>위험</span></div>
    </div>
    <p class="muted" style="font-size: 11px">© White Eyes 팀</p>
  </section>
  <section style="flex: 1 1 520px; min-height: 900px; display: grid; place-items: center; padding: 48px">
    <form class="panel" data-api="POST /login (Form: username, password, _csrf)" data-fnc="FNC-C-001" style="width: 100%; max-width: 400px; padding: 32px; display: flex; flex-direction: column; gap: 18px">
      <div>
        <h2 style="font-size: 22px">{{appName}} 로그인</h2>
      </div>
      <sc-if value="{{showError}}" hint-placeholder-val="{{ true }}">
        <p role="alert" style="padding: 10px 12px; border: 1px solid #6b2a31; border-radius: 8px; background: #2a151a; color: #ffb3b7; font-size: 12px">아이디 또는 비밀번호가 올바르지 않습니다.</p>
      </sc-if>
      <label class="field">아이디<span class="input">superadmin</span></label>
      <label class="field">비밀번호<span class="input">••••••••••</span></label>
      <button class="btn primary lg" type="button" style="width: 100%">로그인</button>
      <sc-if value="{{isUserApp}}" hint-placeholder-val="{{ false }}">
        <p class="muted" style="text-align: center; font-size: 12px">계정이 없나요? <a href="Signup.dc.html" style="color: #76a7ff">회원가입</a></p>
      </sc-if>
    </form>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"app":{"editor":"enum","options":["관리자 앱","사용자 앱"],"default":"관리자 앱"},"showError":{"editor":"boolean","default":true},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const app = this.props.app ?? '관리자 앱';
    const isUserApp = app === '사용자 앱';
    return { appName: isUserApp ? 'White Eyes' : 'White Eyes 관리자', isUserApp, showError: this.props.showError ?? true };
  }
}
</script>
</body>
</html>
