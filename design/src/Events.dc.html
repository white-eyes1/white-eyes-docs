<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>이벤트 로그</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./we.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>body{margin:0}
.sum{flex:1 1 200px;padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.sum strong{font-size:26px}
</style>
</helmet>
<div class="we" style="width: 100%; min-height: 900px; position: relative">
  <dc-import name="AdminHeader" active="events" hint-size="100%,64px"></dc-import>
  <main class="page">
    <div class="page-heading">
      <div><p class="eyebrow">EVENT CENTER</p><h1>이벤트 로그</h1><p>혼잡·급증·캠 이상 이벤트를 확인하고 조치를 기록합니다.</p></div>
      <button class="btn secondary"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"></path></svg>내려받기</button>
    </div>
    <div data-api="GET /api/v1/events/summary → total,unchecked,checked,resolved" data-fnc="FNC-A-036" style="display: flex; gap: 12px; flex-wrap: wrap">
      <div class="panel sum"><span class="muted">전체 (오늘)</span><strong>7</strong></div>
      <div class="panel sum"><span class="muted">미확인</span><strong style="color: #ff8a90">3</strong></div>
      <div class="panel sum"><span class="muted">확인 중</span><strong style="color: #ffc15a">1</strong></div>
      <div class="panel sum"><span class="muted">조치완료</span><strong style="color: #6ee0b9">3</strong></div>
    </div>
    <section class="panel" style="overflow: hidden">
      <div class="filterbar" style="border-radius: 12px 12px 0 0">
        <span class="control plain">2026-10-21</span><span class="control">전체 상태</span><span class="control">전체 종류</span>
        <span class="control plain" style="min-width: 240px; color: #8b98a9">구역·지역 검색</span>
      </div>
      <div class="table-wrap"><div class="dtable" role="table" data-api="GET /api/v1/events?from=&amp;to=&amp;statuses=&amp;types=&amp;keyword=&amp;page=" data-fnc="FNC-A-036" style="--cols: 1fr .7fr 1.5fr 1.3fr .6fr .8fr 1fr">
        <div class="tr th" role="row"><span role="columnheader">발생 시각</span><span role="columnheader">종류</span><span role="columnheader">구역 · 지역</span><span role="columnheader">최고 단계 · 값</span><span role="columnheader">지속</span><span role="columnheader">처리 상태</span><span role="columnheader" style="text-align: right">조치</span></div>
        
          <sc-for list="{{events}}" as="e" hint-placeholder-count="7">
            <div class="tr" role="row">
              <div role="cell">{{e.at}}<small>{{e.end}}</small></div>
              <div role="cell"><span class="chip {{e.kindCls}}">{{e.kind}}</span></div>
              <div role="cell">{{e.zone}}<small>중구 · 은행선화동</small></div>
              <div role="cell">{{e.peak}}</div>
              <div role="cell">{{e.dur}}</div>
              <div role="cell"><span class="chip {{e.stCls}}">{{e.st}}</span></div>
              <div role="cell" style="text-align: right"><sc-if value="{{e.open}}" hint-placeholder-val="{{ true }}"><a class="btn primary sm" href="ActionModal.dc.html">조치하기</a></sc-if><sc-if value="{{e.closed}}" hint-placeholder-val="{{ false }}"><a class="btn ghost sm" href="EventDetail.dc.html">처리됨</a></sc-if></div>
            </div>
          </sc-for>
        
      </div></div>
      <div class="pager"><span>총 7건 · 행을 누르면 상세 창</span><div class="pages"><span class="on">1</span></div></div>
    </section>
  </main>
  <a class="toast" href="EventDetail.dc.html" style="position: absolute; right: 24px; top: 80px; color: inherit; text-decoration: none"><span class="dot l3"></span><b>[혼잡] 은행선화동 3구역 위험</b><span class="muted">방금</span></a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const st = { U: ['미확인', 'unread'], C: ['확인 중', 'review'], R: ['조치완료', 'done'] };
    const ev = (at, end, kind, kindCls, zone, peak, dur, s) => ({
      at, end, kind, kindCls, zone, peak, dur, st: st[s][0], stCls: st[s][1], open: s !== 'R', closed: s === 'R'
    });
    return {
      events: [
        ev('17:13:44', '진행 중', '혼잡', 'l3', '은행선화동 3구역', '위험 · 1.62명/㎡', '12분', 'U'),
        ev('17:05:10', '17:11:00 종료', '급증', 'surge', '은행선화동 2구역', '+148명/5분', '6분', 'U'),
        ev('16:52:31', '진행 중', '캠 이상', 'cam', '목동 1구역', '결과 수신 끊김', '33분', 'U'),
        ev('15:40:02', '16:02:00 종료', '혼잡', 'l2', '은행선화동 2구역', '주의 · 0.82명/㎡', '22분', 'C'),
        ev('14:12:45', '14:20:00 종료', '혼잡', 'l2', '은행선화동 2구역', '주의 · 0.74명/㎡', '8분', 'R'),
        ev('11:03:19', '11:09:00 종료', '급증', 'surge', '은행선화동 1구역', '+96명/5분', '6분', 'R'),
        ev('09:41:55', '09:55:00 종료', '혼잡', 'l3', '(삭제됨) 옛 광장 구역', '위험 · 1.55명/㎡', '14분', 'R')
      ]
    };
  }
}
</script>
</body>
</html>
